# Конфигурация сервера внутри образа. Отдельного default.conf из пакета нет:
# этот файл его заменяет.
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Версия nginx не раскрывается в заголовках ответа.
    server_tokens off;

    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Проверка используется пробами Kubernetes и HEALTHCHECK в образе.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Метку версии не кешируем: после обновления образа её нужно видеть сразу.
    location = /version.txt {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|svg|png|jpg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
