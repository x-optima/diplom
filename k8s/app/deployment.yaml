apiVersion: apps/v1
kind: Deployment
metadata:
  name: diplom-app
  namespace: app
  labels:
    app.kubernetes.io/name: diplom-app
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app.kubernetes.io/name: diplom-app

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app.kubernetes.io/name: diplom-app
        app.kubernetes.io/component: frontend
    spec:
      # Реестр приватный: ключ доступа передаётся секретом, который создаёт
      # скрипт развёртывания перед применением манифестов.
      imagePullSecrets:
        - name: cr-credentials

      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      # Реплики распределяются по разным узлам: все машины кластера находятся
      # в одной зоне, поэтому ограничение задаётся по имени узла.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: diplom-app

      containers:
        - name: nginx
          # Значение подставляет скрипт развёртывания или пайплайн:
          # cr.yandex/<идентификатор реестра>/diplom-app:<тег>
          image: "${IMAGE}"
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]

          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run

      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
