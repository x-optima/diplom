# При обслуживании узла облако может вытеснить поды. Ограничение не даёт
# снять сразу обе реплики, поэтому страница остаётся доступной.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: diplom-app
  namespace: app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: diplom-app
