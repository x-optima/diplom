# Значения Helm для чарта ingress-nginx.
# Кластер собран на обычных виртуальных машинах, без драйвера балансировщика
# облака, поэтому контроллер работает на каждой машине и занимает порты 80 и 443
# напрямую. Приложение и Grafana доступны по внешнему адресу любой машины.

controller:
  kind: DaemonSet

  # Одна реплика на узел: вторая не нужна и не поместится на порту 80.
  replicaCount: 1

  hostPort:
    enabled: true
    ports:
      http: 80
      https: 443

  service:
    type: ClusterIP

  ingressClassResource:
    name: nginx
    enabled: true
    default: true

  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 256Mi

  # Метрики контроллера отдаются на порту 10254, но объект ServiceMonitor
  # не создаётся: его тип появляется только вместе с Prometheus Operator,
  # а контроллер ставится раньше.
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false

  config:
    use-forwarded-headers: "true"
    proxy-body-size: "8m"
    server-tokens: "false"

  # На управляющей машине стоит taint control-plane с эффектом NoSchedule,
  # поэтому DaemonSet занимает только рабочие узлы. Приложение и Grafana
  # доступны по внешнему адресу любого рабочего узла.
  tolerations: []

  admissionWebhooks:
    enabled: true
