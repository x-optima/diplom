# Значения Helm для чарта ingress-nginx.
# Контроллер принимает внешний трафик через балансировщик Yandex Cloud.

controller:
  replicaCount: 2

  service:
    type: LoadBalancer
    externalTrafficPolicy: Local
    annotations:
      yandex.cloud/load-balancer-type: "external"

  ingressClassResource:
    name: nginx
    enabled: true
    default: true

  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 256Mi

  # Метрики контроллера собирает Prometheus.
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring

  config:
    use-forwarded-headers: "true"
    proxy-body-size: "8m"
    server-tokens: "false"

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
          app.kubernetes.io/component: controller

  admissionWebhooks:
    enabled: true
