# Установка Kubernetes на три виртуальные машины Debian 11.
# Управляющая машина готовит кластер через kubeadm, рабочие присоединяются
# к нему. Сеть pod-ов обслуживает flannel.

- name: Ожидание готовности машин по SSH
  hosts: k8s_cluster
  gather_facts: false
  tasks:
    - name: Ожидание подключения по SSH
      wait_for_connection:
        delay: 5
        timeout: 300

- name: Общая подготовка машин
  hosts: k8s_cluster
  become: true
  gather_facts: true
  vars:
    k8s_version: "1.33"

  tasks:
    - name: Отключение подкачки
      command: swapoff -a
      changed_when: false

    - name: Удаление подкачки из fstab
      replace:
        path: /etc/fstab
        regexp: '^([^#].*\sswap\s.*)$'
        replace: '# \1'

    - name: Загрузка модулей ядра
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: '0644'

    - name: Загрузка модулей в текущем сеансе
      modprobe:
        name: "{{ item }}"
      loop:
        - overlay
        - br_netfilter

    - name: Параметры ядра для сети кластера
      copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1
        mode: '0644'

    - name: Применение параметров ядра
      command: sysctl --system
      changed_when: false

    # Репозиторий обновлений безопасности с машин недоступен: security.debian.org
    # не отвечает, а у зеркала Яндекса нет файлов bullseye-security. Пакеты,
    # которые нужны кластеру, есть в основном репозитории, поэтому строка
    # безопасности отключается.
    - name: Отключение репозитория обновлений безопасности
      replace:
        path: /etc/apt/sources.list
        regexp: '^(\s*deb(?:-src)?\s+\S*(?:security\.debian\.org|debian-security)\S*.*)$'
        replace: '# \1'

    # У машин нет IPv6, но DNS отдаёт адреса AAAA, и запросы к внешним
    # репозиториям уходят в никуда. Принудительный IPv4 снимает таймауты.
    - name: Настройка IPv4 для пакетного менеджера
      copy:
        dest: /etc/apt/apt.conf.d/99force-ipv4
        content: |
          Acquire::ForceIPv4 "true";
        mode: '0644'

    # Репозиторий Kubernetes нужен только управляющей машине: у рабочих
    # машин внешний доступ к нему может быть закрыт, пакеты им передаются
    # готовыми файлами. Файл удаляется до обновления списка пакетов, иначе
    # обновление падает на недоступном адресе.
    - name: Удаление репозитория Kubernetes на рабочих машинах
      file:
        path: /etc/apt/sources.list.d/kubernetes.list
        state: absent
      when: inventory_hostname in groups['workers']

    # Репозиторий Docker нужен только управляющей машине: у рабочих
    # машин download.docker.com недоступен, containerd им передаётся
    # готовым пакетом вместе с пакетами Kubernetes.
    - name: Удаление репозитория Docker на рабочих машинах
      file:
        path: /etc/apt/sources.list.d/docker.list
        state: absent
      when: inventory_hostname in groups['workers']

    - name: Обновление списка пакетов
      apt:
        update_cache: true
        cache_valid_time: 0

    # На образе остаётся gpgv из репозитория обновлений безопасности.
    # Основной репозиторий содержит более раннюю версию, и без понижения
    # gnupg не устанавливается: он требует gpgv ниже u2.1.
    - name: Понижение gpgv до версии основного репозитория
      command: apt-get install -y --allow-downgrades gpgv=2.2.27-2+deb11u2
      register: gpgv_downgrade
      changed_when: "'0 upgraded, 0 newly installed' not in gpgv_downgrade.stdout"
      failed_when: false

    - name: Базовые пакеты
      apt:
        name:
          - curl
          - gnupg
          - ca-certificates
          - apt-transport-https
          - conntrack
          - socat
          - ebtables
          - ethtool
          - python3
          - python3-apt
        state: present

    # Ключ проверяет подписи пакетов Kubernetes. Нужен только управляющей
    # машине: рабочие пакеты получают готовыми файлами, а pkgs.k8s.io
    # из их зон недоступен — скачивание ключа там обрывается по таймауту.
    - name: Ключ подписи репозитория Kubernetes
      shell: |
        set -e
        mkdir -p /etc/apt/keyrings
        curl -4 -fsSL "https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/Release.key" \
          | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
      when: inventory_hostname in groups['master']

    # Репозиторий Kubernetes нужен только управляющей машине: у рабочих
    # машин внешний доступ к нему может быть закрыт, пакеты им передаются
    # готовыми файлами.
    - name: Репозиторий Kubernetes
      copy:
        dest: /etc/apt/sources.list.d/kubernetes.list
        content: |
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v{{ k8s_version }}/deb/ /
        mode: '0644'
      when: inventory_hostname in groups['master']

    - name: Удаление репозитория Kubernetes на рабочих машинах
      file:
        path: /etc/apt/sources.list.d/kubernetes.list
        state: absent
      when: inventory_hostname in groups['workers']

    - name: Установка kubelet, kubeadm и kubectl
      apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: true
      when: inventory_hostname in groups['master']

    - name: Запрет обновления пакетов Kubernetes
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl
      when: inventory_hostname in groups['master']

    # Репозиторий Docker нужен только управляющей машине. У рабочих машин
    # download.docker.com недоступен, поэтому containerd им передаётся готовым
    # пакетом вместе с пакетами Kubernetes.
    - name: Ключ подписи репозитория Docker
      shell: |
        set -e
        curl -4 -fsSL https://download.docker.com/linux/debian/gpg \
          | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg
      when: inventory_hostname in groups['master']

    - name: Репозиторий Docker
      copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: |
          deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian bullseye stable
        mode: '0644'
      when: inventory_hostname in groups['master']

    - name: Установка containerd
      apt:
        name: containerd.io
        state: present
        update_cache: true
      when: inventory_hostname in groups['master']

    - name: Настройка containerd на systemd cgroup
      shell: |
        set -e
        mkdir -p /etc/containerd
        containerd config default > /etc/containerd/config.toml
        sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
        sed -i 's|sandbox_image = .*|sandbox_image = "registry.k8s.io/pause:3.10"|' /etc/containerd/config.toml
      args:
        executable: /bin/bash
      when: inventory_hostname in groups['master']

    - name: Перезапуск containerd
      systemd:
        name: containerd
        state: restarted
        enabled: true
        daemon_reload: true
      when: inventory_hostname in groups['master']

    - name: Включение kubelet
      systemd:
        name: kubelet
        enabled: true
      when: inventory_hostname in groups['master']

# У рабочих машин в отдельных зонах внешние репозитории Kubernetes могут быть
# недоступны. Пакеты скачиваются на управляющей машине и передаются рабочим
# через управляющий узел.
- name: Управляющая машина — подготовка пакетов
  hosts: master
  become: true
  gather_facts: false

  tasks:
    - name: Скачивание пакетов без установки
      command: apt-get install -y --download-only --reinstall kubelet kubeadm kubectl containerd.io
      changed_when: false

    - name: Поиск скачанных пакетов
      find:
        paths: /var/cache/apt/archives
        patterns:
          - "kube*.deb"
          - "containerd*.deb"
      register: k8s_debs

    - name: Перенос пакетов на управляющий узел
      fetch:
        src: "{{ item.path }}"
        dest: /tmp/k8s-debs/
        flat: true
      loop: "{{ k8s_debs.files }}"

- name: Управляющая машина — создание кластера
  hosts: master
  become: true
  gather_facts: false

  tasks:
    - name: Проверка наличия конфигурации администратора
      stat:
        path: /etc/kubernetes/admin.conf
      register: admin_conf

    - name: Загрузка образов контейнеров
      command: kubeadm config images pull
      register: pull_images
      retries: 5
      delay: 20
      until: pull_images.rc == 0
      when: not admin_conf.stat.exists

    # Внешний адрес входит в сертификат API-сервера: файл доступа копируется
    # на рабочую станцию, и kubectl обращается к кластеру по внешнему адресу.
    - name: Инициализация кластера
      command: >
        kubeadm init
        --pod-network-cidr=10.244.0.0/16
        --apiserver-advertise-address={{ ansible_host_internal }}
        --apiserver-cert-extra-sans={{ ansible_host }}
        --ignore-preflight-errors=all
      register: kubeadm_init
      when: not admin_conf.stat.exists

    - name: Каталог конфигурации для пользователя
      file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0755'

    - name: Копирование конфигурации администратора
      copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Сеть pod-ов (flannel)
      command: >
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        apply -f https://github.com/flannel-io/flannel/releases/latest/download/kube-flannel.yml
      register: flannel_apply
      changed_when: "'created' in flannel_apply.stdout or 'configured' in flannel_apply.stdout"

    - name: Ожидание готовности узлов
      command: >
        kubectl --kubeconfig /etc/kubernetes/admin.conf
        wait --for=condition=Ready nodes --all --timeout=300s
      changed_when: false

    - name: Создание токена для присоединения
      command: kubeadm token create
      register: join_token
      changed_when: false

    - name: Значение токена для рабочих машин
      set_fact:
        kubeadm_token: "{{ join_token.stdout }}"

# В отдельных зонах реестр registry.k8s.io с рабочих машин недоступен, а без
# образа pause не создаётся ни один под, включая сетевой плагин. Образы
# выгружаются на управляющей машине и передаются рабочим файлом.
- name: Управляющая машина — образы для рабочих
  hosts: master
  become: true
  gather_facts: false

  tasks:
    # Сеть pod-ов на рабочих машинах поднимает kube-flannel, поэтому его
    # образы тоже нужны: ghcr.io с воркеров недоступен так же, как
    # registry.k8s.io, и без переноса узлы остаются NotReady.
    - name: Выгрузка образов pause, kube-proxy и flannel
      shell: |
        set -e
        refs=$(ctr -n k8s.io images ls -q \
          | grep -E 'registry\.k8s\.io/(pause|kube-proxy):|ghcr\.io/flannel-io/flannel' | sort -u)
        ctr -n k8s.io images export /tmp/worker-images.tar $refs
      changed_when: true

    - name: Перенос образов на управляющую машину
      fetch:
        src: /tmp/worker-images.tar
        dest: /tmp/worker-images/
        flat: true

- name: Рабочие машины — присоединение к кластеру
  hosts: workers
  become: true
  gather_facts: false

  tasks:
    - name: Проверка, не присоединена ли машина
      stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_conf

    - name: Копирование пакетов на рабочую машину
      copy:
        src: "/tmp/k8s-debs/{{ item }}"
        dest: "/tmp/{{ item }}"
        mode: '0644'
      loop: "{{ query('fileglob', '/tmp/k8s-debs/*.deb') | map('basename') | list }}"
      when: not kubelet_conf.stat.exists

    # Пакеты ставятся одной командой: kubelet зависит от kubernetes-cni, и при
    # установке по одному apt отклоняет пакет, пока зависимость не установлена.
    - name: Установка пакетов из локальных файлов
      shell: |
        set -e
        apt-get install -y --no-install-recommends /tmp/*.deb
      args:
        executable: /bin/bash
      when: not kubelet_conf.stat.exists

    - name: Запрет обновления пакетов Kubernetes
      dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl
      when: not kubelet_conf.stat.exists

    - name: Настройка containerd на systemd cgroup
      shell: |
        set -e
        mkdir -p /etc/containerd
        containerd config default > /etc/containerd/config.toml
        sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
        sed -i 's|sandbox_image = .*|sandbox_image = "registry.k8s.io/pause:3.10"|' /etc/containerd/config.toml
      args:
        executable: /bin/bash
      when: not kubelet_conf.stat.exists

    - name: Запуск containerd
      systemd:
        name: containerd
        state: restarted
        enabled: true
        daemon_reload: true
      when: not kubelet_conf.stat.exists

    - name: Состав образов в containerd
      command: ctr -n k8s.io images ls -q
      register: containerd_images
      changed_when: false

    - name: Копирование образов pause, kube-proxy и flannel
      copy:
        src: /tmp/worker-images/worker-images.tar
        dest: /tmp/worker-images.tar
        mode: '0644'
      when: "'ghcr.io/flannel-io/flannel' not in containerd_images.stdout"

    - name: Импорт образов в containerd
      command: ctr -n k8s.io images import /tmp/worker-images.tar
      changed_when: true
      when: "'ghcr.io/flannel-io/flannel' not in containerd_images.stdout"

    - name: Включение kubelet
      systemd:
        name: kubelet
        enabled: true
      when: not kubelet_conf.stat.exists

    # Загрузка образов ускоряет первое присоединение, но не обязательна:
    # kubelet скачает нужные образы сам при запуске системных подов. Поэтому
    # недоступность реестра с рабочей машины не останавливает установку.
    - name: Загрузка образов контейнеров
      shell: timeout 120 kubeadm config images pull || true
      register: pull_worker_images
      failed_when: false
      changed_when: false
      when: not kubelet_conf.stat.exists

    - name: Присоединение к кластеру
      command: >
        kubeadm join {{ hostvars[groups['master'][0]]['ansible_host_internal'] }}:6443
        --token {{ hostvars[groups['master'][0]]['kubeadm_token'] }}
        --discovery-token-unsafe-skip-ca-verification
        --ignore-preflight-errors=all
      register: kubeadm_join
      when: not kubelet_conf.stat.exists

- name: Проверка состава кластера
  hosts: master
  become: true
  gather_facts: false

  tasks:
    - name: Список узлов
      command: kubectl --kubeconfig /etc/kubernetes/admin.conf get nodes -o wide
      register: nodes_list
      changed_when: false

    - name: Состояние узлов
      debug:
        msg: "{{ nodes_list.stdout_lines }}"
