# Инвентарь создаёт Terraform: после применения конфигурации файл
# inventory.ini появляется в этом каталоге.
[defaults]
host_key_checking = False
retry_files_enabled = False
inventory = inventory.ini
stdout_callback = default
deprecation_warnings = False

# Несколько задач выполняются на одном соединении: подключение по SSH
# к рабочим машинам идёт через управляющую, лишние разрывы замедляют прогон.
[ssh_connection]
pipelining = True
