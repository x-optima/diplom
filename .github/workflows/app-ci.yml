name: Приложение

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: diplom-app
  NAMESPACE: app
  DEPLOYMENT: diplom-app

jobs:
  build:
    name: Сборка и публикация образа
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Тег и адрес образа
        id: meta
        env:
          YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="sha-${GITHUB_SHA::7}"
          fi

          if [[ -n "${YC_REGISTRY_ID}" ]]; then
            image="cr.yandex/${YC_REGISTRY_ID}/${IMAGE_NAME}"
          else
            image="${IMAGE_NAME}"
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Настройка Buildx
        uses: docker/setup-buildx-action@v3

      - name: Вход в реестр
        if: github.event_name != 'pull_request'
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
        run: |
          printf '%s' "$YC_SA_KEY" > "$RUNNER_TEMP/key.json"
          docker login --username json_key --password-stdin cr.yandex < "$RUNNER_TEMP/key.json"
          rm -f "$RUNNER_TEMP/key.json"

      - name: Сборка образа
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.tag }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Метка latest обновляется только для основной ветки и релизных тегов.
      - name: Метка latest
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          docker buildx imagetools create \
            -t "${{ steps.meta.outputs.image }}:latest" \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"

      - name: Проверка контейнера
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm -d --name app-check -p 8080:80 \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          for attempt in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8080/healthz; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/ | grep -q "Kubernetes"
          docker stop app-check

  deploy:
    name: Развёртывание в кластере
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    permissions:
      contents: read

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Тег образа
        id: meta
        env:
          YC_REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="sha-${GITHUB_SHA::7}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "image=cr.yandex/${YC_REGISTRY_ID}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Установка kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.31.0"

      - name: Настройка доступа к кластеру
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info

      - name: Обновление образа
        run: |
          kubectl -n "${NAMESPACE}" set image "deployment/${DEPLOYMENT}" \
            "nginx=${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"
          kubectl -n "${NAMESPACE}" rollout status "deployment/${DEPLOYMENT}" --timeout=180s

      - name: Состояние ресурсов
        run: |
          kubectl -n "${NAMESPACE}" get pods -o wide
          kubectl -n "${NAMESPACE}" get ingress
