name: Инфраструктура

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
  workflow_dispatch:

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "0"
  TF_VERSION: "1.9.8"

jobs:
  infrastructure:
    name: Проверка и применение конфигурации
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: terraform/infrastructure

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Установка Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Ключ сервисного аккаунта
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
        run: |
          printf '%s' "$YC_SA_KEY" > "$RUNNER_TEMP/key.json"
          chmod 600 "$RUNNER_TEMP/key.json"

      - name: Параметры хранилища состояния
        env:
          TF_BACKEND_ACCESS_KEY: ${{ secrets.TF_BACKEND_ACCESS_KEY }}
          TF_BACKEND_SECRET_KEY: ${{ secrets.TF_BACKEND_SECRET_KEY }}
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          cat > backend.hcl <<EOF
          bucket = "${TF_STATE_BUCKET}"
          key    = "infrastructure/terraform.tfstate"
          region = "ru-central1"

          endpoints = {
            s3 = "https://storage.yandexcloud.net"
          }

          access_key = "${TF_BACKEND_ACCESS_KEY}"
          secret_key = "${TF_BACKEND_SECRET_KEY}"

          skip_region_validation      = true
          skip_credentials_validation = true
          skip_requesting_account_id  = true
          skip_metadata_api_check     = true
          skip_s3_checksum            = true
          EOF

      - name: Инициализация
        run: terraform init -backend-config=backend.hcl

      - name: Проверка форматирования
        run: terraform fmt -check -recursive

      - name: Проверка синтаксиса
        run: terraform validate

      - name: План
        id: plan
        env:
          TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
          TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
          TF_VAR_service_account_key_file: ${{ runner.temp }}/key.json
        run: |
          terraform plan -no-color -input=false -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Публикация плана
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/infrastructure/plan.txt', 'utf8');
            const limit = 60000;
            const body = [
              '### План изменений инфраструктуры',
              '```hcl',
              plan.length > limit ? plan.slice(0, limit) + '\n...' : plan,
              '```'
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Применение
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          TF_VAR_cloud_id: ${{ secrets.YC_CLOUD_ID }}
          TF_VAR_folder_id: ${{ secrets.YC_FOLDER_ID }}
          TF_VAR_service_account_key_file: ${{ runner.temp }}/key.json
        run: terraform apply -input=false -auto-approve tfplan

      - name: Инвентарь Ansible
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ansible-inventory
          path: ${{ github.workspace }}/ansible/inventory.ini
          retention-days: 1

      - name: Удаление файлов с ключами
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/key.json"
          rm -f backend.hcl

  # Машины создаются в предыдущем задании, установка Kubernetes выполняется
  # плейбуком: kubeadm, containerd и сетевой модуль настраиваются на узлах.
  cluster:
    name: Установка Kubernetes на машины
    runs-on: ubuntu-latest
    needs: infrastructure
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read

    steps:
      - name: Получение исходного кода
        uses: actions/checkout@v4

      - name: Установка Ansible
        run: pipx install ansible-core

      - name: Ключ доступа к машинам
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/yandex"
          chmod 600 "$HOME/.ssh/yandex"

      - name: Инвентарь из предыдущего задания
        uses: actions/download-artifact@v4
        with:
          name: ansible-inventory
          path: ansible

      - name: Установка кластера
        working-directory: ansible
        run: ansible-playbook playbook-k8s.yml
